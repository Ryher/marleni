<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1a2e">
  <meta name="robots" content="noindex, nofollow">
  <title>Marleni</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <style>
    #heart {
      position: fixed;
      top: 9vh;
      left: 16px;
      right: 16px;
      z-index: 1;
      margin: 0;
      text-align: center;
      font-family: "VT323", ui-monospace, Menlo, Consolas, monospace;
      font-size: clamp(6rem, 40vw, 12rem);
      font-weight: 400;
      line-height: 1;
      color: #ff8fb8;
      text-shadow: 0 0 18px rgba(255, 143, 184, 0.85), 0 0 2px #000;
    }

    /* weitere Blütenfarben der Wiese: Weiß, Rosa, Blau, Gelb */
    #art .pw-0 { color: #9a96a8; }
    #art .pw-1 { color: #d9d6e6; }
    #art .pw-2 { color: #ffffff; }
    #art .pp-0 { color: #9c3d68; }
    #art .pp-1 { color: #e0679b; }
    #art .pp-2 { color: #ffa3c8; }
    #art .pb-0 { color: #33489e; }
    #art .pb-1 { color: #5b78e6; }
    #art .pb-2 { color: #9fb4ff; }
    #art .yel-0 { color: #a8862a; }
    #art .yel-1 { color: #e8c14a; }
    #art .yel-2 { color: #ffe27a; }

    /* Alpen: hinten (m0) blass, Mitte (m1) dunkler, vorne (m2) grüne Vorberge.
       -r = Gratlinie, -l = Lichtseite, -s = Schattenseite */
    #art .m0-r { color: #8597c2; }
    #art .m0-l { color: #56658f; }
    #art .m0-s { color: #333d5c; }
    #art .m1-r { color: #6c7ca6; }
    #art .m1-l { color: #45527a; }
    #art .m1-s { color: #2a3250; }
    #art .m2-r { color: #5c9a5f; }
    #art .cap-1 { color: #eef4ff; }
    #art .cap-0 { color: #8ea2c9; }
    #art .g0 { color: #2d5a33; }
    #art .g1 { color: #43804a; }

    /* fliegende Katzen: eigene Ebene über den Bergen, unter dem Herz */
    .cat {
      position: fixed;
      top: 0;
      left: 0;
      margin: 0;
      font-family: ui-monospace, Menlo, Consolas, "Courier New", monospace;
      font-weight: 700;
      line-height: 1;
      white-space: pre;
      pointer-events: none;
      user-select: none;
      will-change: transform;
    }
    .cat0 { color: #f4eeff; text-shadow: 0 0 4px rgba(255, 255, 255, 0.6); }
    .cat1 { color: #ffb36b; text-shadow: 0 0 4px rgba(255, 179, 107, 0.6); }
    .cat2 { color: #c9c4d8; text-shadow: 0 0 4px rgba(201, 196, 216, 0.5); }
    .cat3 { color: #d1a8ff; text-shadow: 0 0 4px rgba(209, 168, 255, 0.6); }
  </style>
</head>
<body>
  <pre id="art" aria-hidden="true"></pre>
  <h1 id="heart">&lt;3</h1>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="js/yes.js"></script>
</body>
</html>
